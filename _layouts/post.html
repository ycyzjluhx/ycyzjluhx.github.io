<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="site-main">
      <article class="container page-container post">
        <p class="eyebrow">News</p>
        <h1>{{ page.title }}</h1>
        <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time></p>
        <div class="post-content">{{ content }}</div>
        <p class="back-link"><a href="{{ '/news/' | relative_url }}">← Back to News</a></p>
      </article>
    </main>
    {% include footer.html %}
  </body>
</html>
