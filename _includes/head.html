<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign page_description = page.description | default: site.description %}
<title>{% if page.title and page.title != 'Home' %}{{ page.title }} | Xusheng Zhu{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page_description | escape }}">
<meta name="theme-color" content="#17365d">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.title and page.title != 'Home' %}{{ page.title }} | Xusheng Zhu{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page_description | escape }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/profile.jpg' | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
{% seo %}
