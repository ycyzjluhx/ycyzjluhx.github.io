<header class="site-header">
  <div class="container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Xusheng Zhu home">
      <span class="brand-name">Xusheng Zhu</span>
      <span class="brand-field">6G Wireless Communications</span>
    </a>
    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url == item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
